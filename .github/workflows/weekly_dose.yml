name: The Weekly Dose — Generate & Upload Episode

# Den ukentlige kjøringen skjer på NEXUS1 (weekly-dose.timer), der Kokoro-TTS-en
# kjører lokalt og gratis. Denne workflowen er reserveløsningen: kjør den manuelt
# hvis NEXUS1 er nede, eller med dry_run for å teste pipelinen uten å publisere.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Lag episoden, men ikke publiser til Buzzsprout eller send nyhetsbrev"
        type: boolean
        default: false

jobs:
  generate-episode:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Trengs for å lage GitHub Releases

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: podcast-script
        run: pip install -r requirements.txt

      # Kokoro-modellen er 350 MB og endrer seg aldri — cachen sparer nedlastingen hver gang.
      - name: Cache Kokoro model
        uses: actions/cache@v4
        with:
          path: ~/.local/share/kokoro
          key: kokoro-model-files-v1.0

      - name: Generate episode (script + audio)
        working-directory: podcast-script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python weekly_dose.py

      # Tørrkjøring: last opp lyden som artefakt så den kan lyttes på uten å publisere.
      - name: Upload MP3 as artifact (dry run)
        if: github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: episode-dry-run
          path: podcast-script/output/*.mp3
          retention-days: 7

      - name: Publish episode (GitHub Release + Buzzsprout + newsletter)
        if: github.event.inputs.dry_run != 'true'
        working-directory: podcast-script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          REPO: ${{ github.repository }}
        run: python publish.py
